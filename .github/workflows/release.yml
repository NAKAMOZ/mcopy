name: release

# Build release artifacts on native GitHub-hosted runners and attach the
# packaged installers to a GitHub Release.
#
# Each platform ships a real installer, so the downloaded file is no longer
# required once installation finishes:
#   Windows  mcopy-setup-<version>-x86_64.exe        (Inno Setup, per-user, no UAC)
#   macOS    mcopy-<version>.pkg / .dmg              (pkgbuild / hdiutil)
#   Linux    mcopy-<version>-x86_64.AppImage + .tar.gz (appimagetool)
#
# Code signing / notarization is out of scope; see the release notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}
      tag: ${{ steps.context.outputs.tag }}
      target_commitish: ${{ steps.context.outputs.target_commitish }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Resolve release tag
        id: context
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vX.Y.Z, got: $tag" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_status="$(
              curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
            )"

            case "$tag_status" in
              200)
                checkout_ref="refs/tags/$tag"
                ;;
              404)
                checkout_ref="$GITHUB_SHA"
                echo "Tag $tag does not exist yet; the release will create it from $GITHUB_SHA."
                ;;
              *)
                echo "Could not check release tag $tag; GitHub API returned HTTP $tag_status." >&2
                exit 1
                ;;
            esac
          else
            checkout_ref="$GITHUB_REF"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "tag=$tag"
            echo "target_commitish=$GITHUB_SHA"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  # Gate the release on the test suite passing everywhere. A broken build must
  # never reach the Releases page.
  test:
    needs: release-context
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gpui links against X11/Wayland, xkbcommon and fontconfig, and renders
          # through Vulkan. These are build-time headers; the AppImage does not
          # bundle the matching runtime libraries, so it expects them already
          # present on the host, which is true of any current desktop distro.
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev pkg-config \
            appstream desktop-file-utils

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    needs: [release-context, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Verify package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "Cargo.toml version $package_version does not match release version $RELEASE_VERSION." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev pkg-config \
            appstream desktop-file-utils

      - name: Build (release)
        run: cargo build --release --locked

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild

      - name: Package macOS pkg and dmg
        if: matrix.name == 'macos'
        run: |
          ./scripts/bundle-macos.sh
          ./scripts/package-macos.sh

      - name: Package Linux AppImage and tarball
        if: matrix.name == 'linux'
        run: ./scripts/package-linux.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcopy-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [release-context, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.checkout_ref }}

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          awk -v version="$version" '
            /^##[[:space:]]+/ {
              heading = $0
              sub(/^##[[:space:]]+/, "", heading)
              sub(/[[:space:]].*$/, "", heading)
              gsub(/^\[/, "", heading)
              gsub(/\]$/, "", heading)

              if (in_section) {
                exit
              }

              if (heading == version || heading == "v" version) {
                in_section = 1
              }
            }

            in_section {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md does not contain release notes for ${version}" >&2
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The in-app updater downloads and then runs these artifacts, and none of
      # them are code-signed. It refuses to install anything it cannot check
      # against this file, so a release without it offers no automatic update.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.exe *.pkg *.dmg *.AppImage *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ needs.release-context.outputs.tag }}
          target_commitish: ${{ needs.release-context.outputs.target_commitish }}
          files: |
            dist/*.exe
            dist/*.pkg
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: release-notes.md
          make_latest: true
