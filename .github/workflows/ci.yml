name: ci

# Format, lint and test on every supported platform. The release workflow runs
# the same checks before it packages anything; this job exists so regressions
# are caught on the branch rather than at tag time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Three pushes in a row used to mean waiting for three full matrix runs. Only
# the newest commit on a branch is worth testing, so supersede the rest.
#
# Deliberately not applied to the release workflow: a cancelled release leaves
# a tag with no artifacts attached to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gpui links against X11/Wayland, xkbcommon and fontconfig, and
          # renders through Vulkan.
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev pkg-config \
            appstream desktop-file-utils

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The GUI cannot be exercised on a headless runner, but the CLI paths can:
      # this catches a binary that fails to start at all.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          cargo run --locked --release -- --version
          cargo run --locked --release -- status

  packaging:
    # Verifies the packaging scripts still run, without publishing anything.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libssl-dev pkg-config \
            appstream desktop-file-utils

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh
          ./scripts/package-macos.sh

      - name: Package Linux
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      # An AppImage that doesn't run is not a working artifact.
      - name: Verify the Linux AppImage runs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          appimage="$(readlink -f dist/mcopy-*-x86_64.AppImage)"
          chmod +x "$appimage"

          # --appimage-extract-and-run avoids requiring FUSE, which this
          # runner doesn't have set up.
          "$appimage" --appimage-extract-and-run --version
          "$appimage" --appimage-extract-and-run status

          # The desktop entry and icon must both be named after the
          # application id, or software centres cannot pair them, and
          # appimagetool would have refused to build without them.
          extract_dir="$(mktemp -d)"
          (cd "$extract_dir" && "$appimage" --appimage-extract >/dev/null)
          test -f "$extract_dir/squashfs-root/io.github.nakamoz.mcopy.desktop"
          test -f "$extract_dir/squashfs-root/io.github.nakamoz.mcopy.svg"
          appstreamcli validate --no-net \
            "$extract_dir/squashfs-root/usr/share/metainfo/io.github.nakamoz.mcopy.metainfo.xml"
          desktop-file-validate \
            "$extract_dir/squashfs-root/io.github.nakamoz.mcopy.desktop"
          rm -rf "$extract_dir"
